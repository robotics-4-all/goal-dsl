[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telos"
version = "0.5.0"
description = "Telos — Domain-Specific Language for goal-driven behaviour verification of IoT-enabled CPS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Konstantinos Panayiotou", email = "klpanagi@gmail.com" },
]
keywords = ["telos", "dsl", "iot", "cps", "textx", "goal-driven", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "click",
    "textX>=4.0.0",
    "rich",
    "jinja2",
    "pydantic>=2.0.0",

]

[project.optional-dependencies]
dev = ["wheel", "twine", "ruff", "pre-commit"]
test = ["pytest", "pytest-cov", "httpx"]

[project.urls]
Repository = "https://github.com/robotics-4-all/goal-dsl"

[project.scripts]
telos = "telos.cli.cli:main"

[project.entry-points."textx_languages"]
telos = "telos:telos_language"

[project.entry-points."textx_generators"]
pygen = "telos.transformations.m2t_python:codegen_python"

[tool.setuptools.packages.find]
include = ["telos*"]

[tool.setuptools.package-data]
"telos.grammar" = ["*.tx"]
"telos.templates" = ["*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
